; SenPork firmware ladder — one env, libraries are added tag by tag.
; Reference hardware: TTGO T7 V1.4 Mini32 (ESP32, 4 MB flash, Arduino core).
; Reference production firmware: daquina-io/aqav80 @ improve-mqtt, SenPork_firmware/.

[env:ttgo-t7-v14-mini32]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_raw = yes

; Two OTA slots + SPIFFS: required from v1.0-ota onwards, harmless before that.
board_build.partitions = min_spiffs.csv

; TaskScheduler object-oriented callbacks (DataManager subclasses Task).
build_flags =
    -D _TASK_OO_CALLBACKS
    -D _TASK_INLINE

lib_deps =
    sensirion/Sensirion I2C SHT4x@^1.1.2
    Adafruit/Adafruit Unified Sensor@^1.1.9
    Adafruit/DHT sensor library@^1.4.4
    wifwaf/MH-Z19@^1.5.4
    https://github.com/jcomas/S8_UART.git
    fu-hsi/PMS Library@^1.1.0
    plerup/EspSoftwareSerial@^8.1.0
    bblanchon/ArduinoJson@^7.3.1
    arkhipenko/TaskScheduler@^3.7.0
