; SenPork firmware ladder — one env, libraries are added tag by tag.
; Reference hardware: TTGO T7 V1.4 Mini32 (ESP32, 4 MB flash, Arduino core).
; Reference production firmware: daquina-io/aqav80 @ improve-mqtt, SenPork_firmware/.

[env:ttgo-t7-v14-mini32]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_raw = yes

; Two OTA slots + SPIFFS: required from v1.0-ota onwards, harmless before that.
board_build.partitions = min_spiffs.csv

lib_deps =
    sensirion/Sensirion I2C SHT4x@^1.1.2
